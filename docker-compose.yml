# Two ways in.
#
#   docker compose up demo      reproduce every number, about three minutes
#   docker compose up service   the fleet service on http://127.0.0.1:8000
#
# The demo writes into bind-mounted directories so the figures, results and
# fitted models land on the host rather than disappearing with the container.

services:
  demo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cobalt-battery-prognostics:latest
    command: ["bash", "scripts/run_demo.sh"]
    volumes:
      - ./analysis:/app/analysis
      - ./results:/app/results
      - ./artifacts:/app/artifacts
      # Not the fleet data: it is half a million rows, regenerated in about
      # seventy seconds, and nothing outside the container wants it.
    environment:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"

  service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cobalt-battery-prognostics:latest
    command:
      - python
      - -m
      - cobalt.cli
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      # Read-only: the service loads the models, it does not fit them.
      - ./artifacts:/app/artifacts:ro
    environment:
      COBALT_CONFIG: /app/config/default.yaml
      COBALT_ARTEFACTS: /app/artifacts/default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
