name: CI

# Three jobs, deliberately.
#
# GitHub bills each job rounded up to the whole minute, so five jobs doing four
# and a half minutes of work cost seven minutes. The previous shape here paid
# that rounding five times over and installed the same dependency set four
# times, which was 42% of all the compute it used.
#
# So: one job does every check that needs Python 3.12, a second repeats only
# lint and tests on 3.13 to catch version drift and the container build runs on
# pushes to main rather than on every commit of every branch. Installs go
# through uv, which handles this dependency set in well under ten seconds
# against pip's twenty-eight.
#
# This repository is public, so none of these minutes are actually billed.
# Keeping it lean is for the feedback loop and so the same workflow stays
# affordable if it is ever copied into a private repository.

on:
  push:
    branches: [main]
    # Documentation is not checked by anything here, so a docs-only commit does
    # not need a runner. README.md is deliberately NOT in this list: its tables
    # are generated and the reproducibility job exists to catch a stale one.
    paths-ignore:
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  # Supersede an in-flight run when another commit lands on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # matplotlib has no display on a runner and will not pick a backend on its own.
  MPLBACKEND: Agg
  # scikit-learn and numpy will each spawn a thread per core and then contend.
  # Two is faster than four on a two-core runner.
  OMP_NUM_THREADS: "2"
  PYTHONUNBUFFERED: "1"

jobs:
  checks:
    name: checks and pipeline (py3.12)
    runs-on: ubuntu-24.04
    # Measured at about ninety seconds of work. Eight leaves room for a cold
    # runner without letting a hang sit on one for twenty.
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # uv rather than pip, and from PyPI rather than from an action. Pip took
        # twenty-eight seconds on this dependency set, which was 42% of the
        # whole workflow's compute; uv does it in well under ten because it
        # downloads in parallel and unpacks far faster. Installing it as a
        # wheel keeps this to first-party actions and leaves nothing pinned to
        # a third-party major tag that can go stale.
        run: |
          python -m pip install --quiet uv
          uv pip install --system -r requirements-dev.txt
          uv pip install --system --no-deps -e .

      # Cheapest checks first, so an obvious failure reports in twenty seconds
      # rather than after the pipeline has run.
      - name: Lint
        run: ruff check src tests scripts

      - name: Format
        run: ruff format --check src tests scripts

      - name: Tests
        run: pytest -q

      # Every table in the README is rendered from committed JSON. This
      # regenerates them and fails if the file has drifted, so a stale results
      # table is a red build rather than a quiet lie.
      - name: README matches the committed results
        run: python -m cobalt.check_readme --config config/default.yaml

      - name: Shell scripts parse
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" && echo "ok: $script"
          done

      - name: Every source file is tracked by git
        # A `.gitignore` pattern written without a leading slash matches at any
        # depth. `data/` was meant for the generated fleet at the repository
        # root and silently excluded src/cobalt/data/ from the first commit.
        # Everything passed locally and only a fresh clone was broken.
        run: |
          set -euo pipefail
          untracked=$(git ls-files --others --exclude-standard -- src tests scripts)
          if [ -n "$untracked" ]; then
            echo "these source files are not in the repository:"
            echo "$untracked"
            exit 1
          fi
          echo "every file under src/, tests/ and scripts/ is tracked"

      - name: The committed stream logs are reproducible
        # cobalt stream runs a simulated pack through the committed model, once
        # straight from the simulator and once through a simulated BMS node, a
        # python-can virtual bus and the DBC. Both logs are committed, so both
        # have to come out the same every time or `make demo` leaves a dirty
        # tree and the byte-identical claim in the README stops holding.
        run: |
          set -euo pipefail
          python -m cobalt.cli stream --config config/default.yaml
          python -m cobalt.cli stream --config config/default.yaml --source can
          git diff --exit-code -- artifacts/default/stream_demo.json artifacts/default/stream_demo_can.json \
            || { echo "a stream log changed between runs"; exit 1; }
          echo "both stream logs reproduced byte for byte"

      - name: CAN link over Linux vcan, node and receiver as two processes
        # The tests run both ends on the in-process virtual bus. This puts them
        # in separate processes on a SocketCAN vcan0 interface, the code path a
        # physical adapter would use. It needs the vcan kernel module; if the
        # runner cannot load it the script says so and the step passes, since
        # the protocol itself is already covered by tests/test_can.py.
        run: bash scripts/can_vcan_e2e.sh

      - name: Committed generated files use LF and carry no absolute paths
        # Path.write_text follows the platform, so a file written on Windows and
        # one written here differ by a carriage return per line. A Windows path
        # in a committed results file breaks every Linux consumer of it,
        # silently and much later. Both checks are one script because both read
        # the same files.
        run: python scripts/check_generated_files.py

      # The full fleet takes a few minutes of simulation, so CI runs the small
      # config instead. This proves that simulation, feature extraction, every
      # split protocol, every model, conformal calibration, both cost models,
      # the figures, the model card and the hardware interface all connect. It
      # proves nothing about accuracy and scripts/run_smoke.sh says so on every
      # run. Last, because it is the slowest thing here.
      - name: Whole pipeline on a small fleet
        run: bash scripts/run_smoke.sh

      - name: Every artefact was produced
        run: |
          set -euo pipefail
          for artefact in \
              results/ci/summary.json \
              analysis/ci/EVALUATION.md \
              analysis/ci/protocol_gap.png \
              analysis/ci/cost.png \
              analysis/ci/parity_online.png \
              artifacts/ci/early_life_model.joblib \
              artifacts/ci/online_model.joblib \
              artifacts/ci/model_card.json \
              artifacts/ci/stream_demo.json \
              artifacts/ci/stream_demo_can.json ; do
            test -s "$artefact" || { echo "missing or empty: $artefact"; exit 1; }
            echo "ok: $artefact ($(stat -c%s "$artefact") bytes)"
          done

      - name: The smoke run did not touch the committed results
        # scripts/run_smoke.sh deliberately omits --update-readme. If that ever
        # changes, a CI run would silently rewrite the README's numbers with
        # figures the script itself calls meaningless.
        run: |
          set -euo pipefail
          git diff --exit-code -- README.md results/default analysis/default artifacts/default \
            || { echo "the smoke run modified the committed results"; exit 1; }

      - name: The model card refuses to hide the data source
        run: python scripts/check_model_card.py artifacts/ci/model_card.json

      # Only on failure. On a green run nobody opens these, and uploading them
      # anyway costs time on every single push.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-outputs
          path: |
            results/ci/
            analysis/ci/
            artifacts/ci/model_card.json
            artifacts/ci/stream_demo.json
            artifacts/ci/stream_demo_can.json
            artifacts/ci/stream_vcan.json
          retention-days: 7
          if-no-files-found: warn

  compat:
    name: compat (py3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --quiet uv
          uv pip install --system -r requirements-dev.txt
          uv pip install --system --no-deps -e .

      # Lint and tests only. The pipeline, the reproducibility checks and the
      # container all exercise code paths that do not vary by interpreter
      # version, so repeating them here would buy nothing. 3.11 and earlier
      # cannot run this at all: the pinned numpy and scipy both require 3.12.
      - name: Lint
        run: ruff check src tests scripts

      - name: Tests
        run: pytest -q

  docker:
    name: docker build
    # Pushes to main and manual runs only. The image is a delivery artefact
    # rather than a correctness check, the host job above already runs the same
    # suite, and building it on every commit of every branch was the single most
    # expensive thing this workflow did.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: cobalt-battery-prognostics:ci
          cache-from: type=gha
          # mode=min caches the layers that end up in the image rather than
          # every intermediate one. For a linear Dockerfile that is nearly the
          # same hit rate at a fraction of the upload and of the 10 GB cache
          # budget this repository shares with everything else.
          cache-to: type=gha,mode=min

      # The whole suite, not a sample. Running one file here would miss the
      # tests that check the repository against its own documentation, which are
      # exactly the ones that fail when the image is missing README.md or docs/.
      - name: The image passes the test suite
        run: docker run --rm cobalt-battery-prognostics:ci pytest -q

      - name: The service starts inside the image and answers
        run: |
          set -euo pipefail
          docker run -d --name cobalt-service -p 8000:8000 \
            -e COBALT_ARTEFACTS=/app/artifacts/default \
            cobalt-battery-prognostics:ci \
            python -m cobalt.cli serve --host 0.0.0.0 --port 8000
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "service never became healthy"; docker logs cobalt-service; exit 1
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/healthz
          echo
          curl -sf http://127.0.0.1:8000/v1/model | head -c 400
          echo

      - name: Stop the service
        # Always, so a failure above cannot leave a container running on the
        # runner and a port bound for whatever comes next.
        if: always()
        run: docker rm -f cobalt-service 2>/dev/null || true
