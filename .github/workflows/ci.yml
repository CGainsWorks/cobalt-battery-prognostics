name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # matplotlib has no display on a runner and will not pick a backend on its own.
  MPLBACKEND: Agg
  # scikit-learn and numpy will each spawn a thread per core and then contend.
  OMP_NUM_THREADS: "2"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12 produced the committed results. 3.13 is here to catch anything
        # that only works on that one. 3.11 and earlier cannot run this: the
        # pinned numpy and scipy both require 3.12.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Lint
        run: python -m ruff check src tests

      - name: Tests
        run: python -m pytest -q

  smoke:
    name: end-to-end on a small fleet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      # The full fleet takes a few minutes of simulation, so CI runs the small
      # config instead. This job proves that simulation, feature extraction,
      # every split protocol, every model, conformal calibration, both cost
      # models, the figures, the model card and the hardware interface all
      # connect. It proves nothing about accuracy and scripts/run_smoke.sh says
      # so on every run.
      - name: Whole pipeline on a small fleet
        run: bash scripts/run_smoke.sh

      - name: Every artefact was produced
        run: |
          set -euo pipefail
          for artefact in \
              results/ci/summary.json \
              analysis/ci/EVALUATION.md \
              analysis/ci/protocol_gap.png \
              analysis/ci/cost.png \
              analysis/ci/parity_online.png \
              artifacts/ci/early_life_model.joblib \
              artifacts/ci/online_model.joblib \
              artifacts/ci/model_card.json \
              artifacts/ci/stream_demo.json ; do
            test -s "$artefact" || { echo "missing or empty: $artefact"; exit 1; }
            echo "ok: $artefact ($(stat -c%s "$artefact") bytes)"
          done

      - name: The smoke run did not touch the committed results
        # scripts/run_smoke.sh deliberately omits --update-readme. If that ever
        # changes, a CI run would silently rewrite the README's numbers with
        # figures the script itself calls meaningless.
        run: |
          set -euo pipefail
          git diff --exit-code -- README.md results/default analysis/default artifacts/default \
            || { echo "the smoke run modified the committed results"; exit 1; }

      - name: The model card refuses to hide the data source
        run: |
          python - <<'PY'
          import json, pathlib
          card = json.loads(pathlib.Path("artifacts/ci/model_card.json").read_text())
          assert list(card)[0] == "data_source", list(card)[:3]
          assert "SIMULATED" in card["data_source"], card["data_source"]
          for task in ("early_life", "online_soh"):
              reported = card["models"][task]["reported"]
              assert reported["protocol"] == "batch_independent", (task, reported)
              print(f"{task}: {reported['protocol']} rmse={reported['rmse_cycles']} cycles")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-outputs
          path: |
            results/ci/
            analysis/ci/
            artifacts/ci/model_card.json
            artifacts/ci/stream_demo.json
          retention-days: 14
          if-no-files-found: warn

  reproducible:
    name: quoted numbers come from a script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      # Every table in the README is rendered from committed JSON. This
      # regenerates them and fails if the file has drifted, so a stale results
      # table is a red build rather than a quiet lie.
      - name: README matches the committed results
        run: python -m cobalt.check_readme --config config/default.yaml

      - name: Shell scripts parse
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" && echo "ok: $script"
          done

      - name: Every source file is tracked by git
        # A `.gitignore` pattern written without a leading slash matches at any
        # depth. `data/` was meant for the generated fleet at the repository
        # root and silently excluded src/cobalt/data/ from the first commit.
        # Everything passed locally and only a fresh clone was broken.
        run: |
          set -euo pipefail
          untracked=$(git ls-files --others --exclude-standard -- src tests)
          if [ -n "$untracked" ]; then
            echo "these source files are not in the repository:"
            echo "$untracked"
            exit 1
          fi
          echo "every file under src/ and tests/ is tracked"

      - name: The committed stream log is reproducible
        # cobalt stream runs a simulated pack through the committed model over
        # the hardware interface. Its output is committed, so it has to come out
        # the same every time or `make demo` leaves a dirty tree and the
        # byte-identical claim in the README stops holding.
        run: |
          set -euo pipefail
          python -m cobalt.cli stream --config config/default.yaml
          git diff --exit-code -- artifacts/default/stream_demo.json \
            || { echo "the stream log changed between runs"; exit 1; }
          echo "stream log reproduced byte for byte"

      - name: The committed generated files use LF endings
        # Path.write_text follows the platform, so a file written on Windows and
        # one written here differ by a carriage return per line. Everything goes
        # through cobalt.textio instead and this checks it stuck.
        run: |
          python - <<'PY'
          import pathlib
          import sys

          patterns = ("results/**/*.json", "results/**/*.csv",
                      "analysis/**/*.md", "artifacts/**/*.json")
          carriage_return = chr(13).encode()
          bad = [str(p) for pattern in patterns
                 for p in pathlib.Path(".").glob(pattern)
                 if carriage_return in p.read_bytes()]
          if bad:
              print("carriage returns in:")
              for name in bad:
                  print("  " + name)
              sys.exit(1)
          print("every committed generated file uses LF")
          PY

      - name: No absolute paths leaked into the committed JSON
        # A Windows path in a committed results file breaks every Linux
        # consumer of it, silently and much later.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for path in pathlib.Path(".").glob("**/summary.json"):
              if ".venv" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              for marker in ("C:\\\\", "/home/", "/Users/"):
                  if marker in text:
                      bad.append(f"{path}: contains {marker!r}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("no absolute paths in committed results")
          PY

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: cobalt-battery-prognostics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The whole suite, not a sample. Running one file here would miss the
      # tests that check the repository against its own documentation, which are
      # exactly the ones that fail when the image is missing README.md or docs/.
      - name: The image passes the test suite
        run: docker run --rm cobalt-battery-prognostics:ci python -m pytest -q

      - name: The image can check the README against the committed results
        run: >-
          docker run --rm cobalt-battery-prognostics:ci
          python -m cobalt.check_readme --config config/default.yaml

      - name: The service starts inside the image and answers
        run: |
          set -euo pipefail
          docker run -d --name cobalt-service -p 8000:8000 \
            -e COBALT_ARTEFACTS=/app/artifacts/default \
            cobalt-battery-prognostics:ci \
            python -m cobalt.cli serve --host 0.0.0.0 --port 8000
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "service never became healthy"; docker logs cobalt-service; exit 1
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/healthz
          echo
          curl -sf http://127.0.0.1:8000/v1/model | head -c 400
          echo

      - name: Stop the service
        # Always, so a failure above cannot leave a container running on the
        # runner and a port bound for whatever comes next.
        if: always()
        run: docker rm -f cobalt-service 2>/dev/null || true
